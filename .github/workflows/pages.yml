# Publica o modo demonstração no GitHub Pages: o mesmo Index.html do Web App + os dados sintéticos.
# Para ativar: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ['apps-script/dashboard/Index.html', 'demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir _site
          cp apps-script/dashboard/Index.html _site/index.html
          cp demo/demo.json _site/demo.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
